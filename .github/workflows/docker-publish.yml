name: 构建并发布 Release 与 Docker 镜像

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/mymihomo:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/mymihomo:latest

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Build Release binaries
        run: |
          VERSION=${GITHUB_REF_NAME:-dev}
          mkdir -p dist

          # linux/amd64 (纯静态构建)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${VERSION}" \
            -o dist/mymihomo-linux-amd64 ./cmd/mymihomo/

          # linux/arm64 (纯静态构建)
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=${VERSION}" \
            -o dist/mymihomo-linux-arm64 ./cmd/mymihomo/

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mymihomo-linux-amd64
            dist/mymihomo-linux-arm64
