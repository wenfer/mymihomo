name: 自动构建推送镜像到ghcr.io

on:
  push:
    branches:
      - dev-rust
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/mymihomo:${{ github.run_number }}
            ghcr.io/${{ github.repository_owner }}/mymihomo:latest

      - name: Set up Rust (for Release binaries)
        if: startsWith(github.ref, 'refs/tags/')
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl

      - name: Install zig & cargo-zigbuild
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pip install ziglang
          cargo install cargo-zigbuild

      - name: Build Release binaries
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF_NAME:-dev}
          mkdir -p dist

          # linux/amd64
          VERSION=${VERSION} cargo zigbuild --release --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/mymihomo dist/mymihomo-linux-amd64

          # linux/arm64
          VERSION=${VERSION} cargo zigbuild --release --target aarch64-unknown-linux-musl
          cp target/aarch64-unknown-linux-musl/release/mymihomo dist/mymihomo-linux-arm64

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mymihomo-linux-amd64
            dist/mymihomo-linux-arm64
